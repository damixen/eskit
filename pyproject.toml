[project]
name = "eskit"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0",
    "anthropic",
    "python-dotenv",
    "ollama"
]

[project.scripts]
eskit = "eskit.cli:main"

[tool.setuptools.packages.find]
include = ["eskit*"]

[tool.setuptools.package-data]
"eskit.data" = ["**/*"]